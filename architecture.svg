<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1330" viewBox="0 0 1240 1330" role="img" aria-labelledby="title desc">
<title id="title">Laya Decision Service: current query flow</title>
<desc id="desc">A local API passes a user request to Laya predictions, explicit rules, planning checks, configured workflow steps and JSON. Uncertain or unsupported requests return no steps. Original model predictions remain visible.</desc>
<rect width="1240" height="1330" fill="#f6f8fc"/>
<text x="65" y="35" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#24324a">Laya Decision Service</text>
<text x="65" y="88" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#5c6b83">Current architecture | Local PyTorch Laya | API v1.1.0</text>
<rect x="65" y="135" width="18" height="18" rx="4" fill="#ffffff" stroke="#d4dce9"/>
<text x="93" y="132" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">API / response</text>
<rect x="340" y="135" width="18" height="18" rx="4" fill="#eaf0ff" stroke="#6c87df"/>
<text x="368" y="132" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Model predictions</text>
<rect x="615" y="135" width="18" height="18" rx="4" fill="#fff4df" stroke="#dfaa4a"/>
<text x="643" y="132" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Rules / checks</text>
<rect x="890" y="135" width="18" height="18" rx="4" fill="#e5f4ee" stroke="#5f9f86"/>
<text x="918" y="132" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Configured steps</text>
<polyline points="397,275 397,315" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="397,315 391,305 403,305" fill="#8794aa"/>
<polyline points="397,405 397,450" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="397,450 391,440 403,440" fill="#8794aa"/>
<polyline points="397,564 397,612" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="397,612 391,602 403,602" fill="#8794aa"/>
<polyline points="397,738 397,785" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="397,785 391,775 403,775" fill="#8794aa"/>
<polyline points="397,907 397,954" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="397,954 391,944 403,944" fill="#8794aa"/>
<polyline points="397,1064 397,1115" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="397,1115 391,1105 403,1105" fill="#8794aa"/>
<polyline points="820,335 785,335 785,507 730,507" fill="none" stroke="#8794aa" stroke-width="2"/>
<polygon points="730,507 740,501 740,513" fill="#8794aa"/>
<polyline points="730,527 820,527" fill="none" stroke="#6c87df" stroke-width="2"/>
<polygon points="820,527 810,521 810,533" fill="#6c87df"/>
<polyline points="1175,527 1205,527 1205,1210 730,1210" fill="none" stroke="#6c87df" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="730,1210 740,1204 740,1216" fill="#6c87df"/>
<polyline points="730,845 820,845" fill="none" stroke="#d88c7c" stroke-width="2"/>
<polygon points="820,845 810,839 810,851" fill="#d88c7c"/>
<polyline points="1175,885 1188,885 1188,1175 730,1175" fill="none" stroke="#d88c7c" stroke-width="2"/>
<polygon points="730,1175 740,1169 740,1181" fill="#d88c7c"/>
<rect x="65" y="195" width="665" height="80" rx="14" fill="#ffffff" stroke="#d4dce9" stroke-width="2"/>
<text x="83" y="211" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">1. User query</text>
<text x="83" y="246" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">HTTP: POST /agent/plan | Swagger | standalone CLI</text>
<rect x="65" y="315" width="665" height="90" rx="14" fill="#ffffff" stroke="#d4dce9" stroke-width="2"/>
<text x="83" y="331" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">2. Validate the request</text>
<text x="83" y="366" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">GTMPlanRequest | reject blank prompts | trim whitespace</text>
<rect x="65" y="450" width="665" height="114" rx="14" fill="#eaf0ff" stroke="#6c87df" stroke-width="2"/>
<text x="83" y="466" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">3. Laya choice predictions</text>
<text x="83" y="501" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">One batch: intent, role, industry, geography</text>
<text x="83" y="528" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">engine.py -&gt; Router.predict(model="typed-decisions")</text>
<rect x="65" y="612" width="665" height="126" rx="14" fill="#fff4df" stroke="#dfaa4a" stroke-width="2"/>
<text x="83" y="628" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">4. Resolve the explicit request</text>
<text x="83" y="663" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Intent rules + scope keywords can override predictions</text>
<text x="83" y="690" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Missing targets -&gt; none_specified; preserve raw predictions</text>
<rect x="65" y="785" width="665" height="122" rx="14" fill="#fff4df" stroke="#dfaa4a" stroke-width="2"/>
<text x="83" y="801" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">5. Check whether a plan is supported</text>
<text x="83" y="836" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Intent rule, or model score &gt;= 0.5; supported single scope</text>
<text x="83" y="863" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">A matching blueprint is required; no outbound fallback</text>
<rect x="65" y="954" width="665" height="110" rx="14" fill="#e5f4ee" stroke="#5f9f86" stroke-width="2"/>
<text x="83" y="970" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">6. Expand blueprint and map tools</text>
<text x="83" y="1005" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Ordered actions -&gt; configured preferred_tool</text>
<text x="83" y="1032" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Only when status is planned; no tool execution</text>
<rect x="65" y="1115" width="665" height="119" rx="14" fill="#ffffff" stroke="#d4dce9" stroke-width="2"/>
<text x="83" y="1131" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">7. Structured JSON response</text>
<text x="83" y="1166" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Status + final intent + target scope + ordered steps</text>
<text x="83" y="1193" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Sources + explanations + original model_predictions</text>
<rect x="820" y="195" width="355" height="211" rx="14" fill="#ffffff" stroke="#d4dce9" stroke-width="2"/>
<text x="838" y="211" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">taxonomy.py</text>
<text x="838" y="246" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Shared demo configuration:</text>
<text x="838" y="273" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">- finite choice menus</text>
<text x="838" y="300" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">- explicit scope patterns</text>
<text x="838" y="327" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">- intent blueprints</text>
<text x="838" y="354" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">- demo tool descriptions</text>
<rect x="820" y="450" width="355" height="114" rx="14" fill="#eaf0ff" stroke="#6c87df" stroke-width="2"/>
<text x="838" y="466" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">Keep original predictions</text>
<text x="838" y="501" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">Model choices and scores</text>
<text x="838" y="528" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">remain available for review</text>
<rect x="820" y="785" width="355" height="145" rx="14" fill="#fff0ed" stroke="#d88c7c" stroke-width="2"/>
<text x="838" y="801" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#24324a">No workflow expansion</text>
<text x="838" y="836" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">needs_clarification</text>
<text x="838" y="863" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">or unsupported</text>
<text x="838" y="890" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#24324a">steps: []</text>
<text x="420" y="918" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#557e6e">planned</text>
<text x="835" y="747" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#a45e50">uncertain / unsupported</text>
<text x="835" y="983" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#a45e50">Return status and clarification</text>
<text x="835" y="1010" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#a45e50">in the same JSON envelope</text>
<text x="835" y="1070" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526fae">Original model scores are</text>
<text x="835" y="1097" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526fae">retained, even after corrections</text>
<text x="65" y="1268" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6b83">Planning demo: agents/tools are not called, emails are not generated, Oppora is not connected.</text>
<text x="65" y="1297" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5c6b83">Rules and fixed mappings have null confidence. Model probabilities are not verified accuracy.</text>
</svg>
